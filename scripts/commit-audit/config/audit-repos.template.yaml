# コミット前の監査 (pre-commit-claude-audit.sh・pre-commit-machine-audit.sh) が、監査するリポジトリとして読むファイルの雛形。
# このファイルを同じディレクトリに audit-repos.yaml という名前でコピーし、自分のリポジトリに合わせて書き換える。
# コピーした audit-repos.yaml は git で管理しない。
#
# repos の下に、監査するリポジトリのディレクトリ名をキーにして 1 リポジトリ 1 項目で書く。ここに書かないリポジトリは監査しない。
# 設定が要らないリポジトリは {} と書く。
#
# overlay_dir:
#   リポジトリ固有のルールを置くディレクトリ。リポジトリのルートからの相対パス。省略すると rules。
# extra_docs:
#   監査の前提として、ルールに加えて読ませるドキュメント。リポジトリのルートからの相対パスで並べる。

repos:
  shop-storefront: {}

  # 別リポジトリのルールとドキュメントを使うリポジトリ
  shop-checkout:
    overlay_dir: ../shop-common/rules
    extra_docs:
      - ../shop-common/docs/GLOSSARY.md

  # ルールとドキュメントの置き場になっているリポジトリ
  shop-common:
    extra_docs:
      - docs/GLOSSARY.md
